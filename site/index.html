<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>BLACKBOX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* BLACKBOX/OS: a CRT desktop. Folders down the left, a live virus as the wallpaper, windows that open, stack and drag,
   a taskbar along the bottom. On a phone the bezel goes and each window opens as a full sheet. */
:root {
  color-scheme: dark;
  --room: #030201; --bezel: #15110c; --bezel-hi: #241d14;
  --bg: #080503; --desk: #0a0704; --win: #0e0905; --win-2: #130c06; --inset: #060402;
  --text: #efe1b8; --bright: #fff3cc; --muted: #b59a60; --dim: #8b7447;
  --amber: #f1b92f; --amber-soft: #d69a22; --amber-deep: #7e5311;
  --line: rgba(241,185,47,.18); --line-strong: rgba(241,185,47,.45); --wash: rgba(241,185,47,.08);
  --hot: #ff5b3d; --you: #7fd1c7; --daemon: #c3a6ff; --steel: #86b6c6; --ready: #8fd46b; --next: #ffd85c;
  --r-stock: #e9e2cf; --r-blue: #5f9cff; --r-yellow: #f0d54a; --r-gold: #d9a53c; --r-orange: #ff8a3d; --r-set: #b6cf55;
  --mono: 'IBM Plex Mono', ui-monospace, monospace; --sans: 'Inter Tight', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; background: var(--room); }
body { color: var(--text); font: 15px/1.55 var(--sans); overflow: hidden; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
a { color: var(--amber); }
p { margin: 0; }
h1, h2, h3, h4 { margin: 0; }

/* ---------- the monitor ---------- */
.monitor { height: 100%; padding: 14px max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); display: grid; grid-template-rows: minmax(0, 1fr) auto; background: var(--room); }
.bezel { min-height: 0; background: var(--bezel); border-radius: 22px 22px 0 0; padding: 16px 16px 0; box-shadow: inset 0 1px 0 var(--bezel-hi), 0 0 0 1px #000; display: grid; }
.screen { position: relative; min-height: 0; border-radius: 14px; overflow: hidden; background: var(--desk);
  box-shadow: inset 0 0 0 1px #000, inset 0 0 70px rgba(0,0,0,.85);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; animation: on .6s cubic-bezier(.2,.8,.2,1) both; }
.screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 50; border-radius: 14px;
  background: radial-gradient(130% 110% at 50% 45%, transparent 62%, rgba(0,0,0,.5) 100%); }
@keyframes on { 0% { transform: scaleY(.004) scaleX(.5); filter: brightness(4); } 50% { transform: scaleY(.004) scaleX(1); filter: brightness(3); } 100% { transform: none; filter: none; } }
.chin { background: var(--bezel); border-radius: 0 0 22px 22px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 26px 12px; box-shadow: 0 1px 0 #000; }
.knobs { display: flex; gap: 10px; }
.knob { width: 16px; height: 16px; border-radius: 50%; background: #0c0a07; box-shadow: inset 0 1px 0 #2d251a, 0 0 0 1px #000; position: relative; }
.knob::after { content: ''; position: absolute; left: 50%; top: 3px; width: 2px; height: 5px; margin-left: -1px; background: var(--amber); }
.plate { font: 500 11px/1 var(--mono); letter-spacing: 6px; color: #6d5a37; }
.lamps { display: flex; gap: 14px; font: 600 9px/1 var(--mono); letter-spacing: 1.5px; color: #5e4d30; }
.lamps span { display: inline-flex; align-items: center; gap: 5px; }
.lamps i { width: 6px; height: 6px; border-radius: 50%; background: #2a2217; }
.lamps .on i { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
.lamps .net i { background: var(--you); box-shadow: 0 0 6px var(--you); }

/* ---------- menu bar ---------- */
.menubar { position: relative; z-index: 30; display: flex; align-items: center; gap: 18px; min-height: 40px; padding: 0 16px; background: rgba(14,9,5,.92); border-bottom: 1px solid var(--line); font: 500 13px/1 var(--mono); }
.os { display: flex; align-items: center; gap: 10px; color: var(--bright); font-weight: 600; letter-spacing: 2px; }
.mark { flex: none; width: 14px; height: 14px; background: #030201; box-shadow: 0 0 0 1px rgba(255,238,196,.5), 0 0 3px .5px rgba(255,226,150,.7), 0 0 10px 2px rgba(241,185,47,.3); }
.ver { color: var(--dim); letter-spacing: 1px; }
.menubar .sp { flex: 1; }
.who { color: var(--muted); } .who b { color: var(--you); font-weight: 600; }
.clock { color: var(--muted); font-variant-numeric: tabular-nums; }
.playbtn { display: inline-flex; align-items: center; gap: 8px; min-height: 28px; padding: 0 12px; border: 1px solid var(--amber); border-radius: 3px; background: var(--amber); color: #0a0603; text-decoration: none; font: 600 12px/1 var(--mono); letter-spacing: 1.5px; }
.playbtn:hover { background: var(--bright); border-color: var(--bright); }

/* ---------- desktop ---------- */
.desk { position: relative; min-height: 0; overflow: hidden;
  background: radial-gradient(70% 80% at 72% 55%, rgba(241,185,47,.05), transparent 70%), repeating-linear-gradient(to bottom, rgba(255,226,150,.016) 0 1px, transparent 1px 3px), var(--desk); }
.wall { position: absolute; right: 2%; bottom: 4%; width: min(62%, 900px); aspect-ratio: 1.35; cursor: crosshair; opacity: .9; }
.wall canvas { width: 100%; height: 100%; display: block; }
.wall-cap { position: absolute; right: 22px; bottom: 14px; z-index: 1; font: 500 11px/1.4 var(--mono); color: var(--dim); letter-spacing: 1px; text-align: right; pointer-events: none; }
.wall-cap b { color: var(--muted); font-weight: 600; }
.icons { position: absolute; left: 12px; top: 10px; bottom: 10px; width: 96px; display: grid; grid-template-columns: 92px; grid-auto-rows: 62px; align-content: start; gap: 0; overflow-y: auto; scrollbar-width: none; z-index: 2; }
.ico { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 4px; padding: 6px 4px 4px; border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer; color: var(--text); font: 500 12px/1.25 var(--mono); text-align: center; }
.ico svg { width: 32px; height: 27px; color: var(--amber); filter: drop-shadow(0 0 6px rgba(241,185,47,.25)); }
.ico:hover { background: var(--wash); border-color: var(--line); }
.ico.on { background: rgba(241,185,47,.14); border-color: var(--line-strong); }
.ico .nm { padding: 1px 4px; border-radius: 2px; overflow-wrap: anywhere; font-size: 11.5px; }
.ico.on .nm { background: var(--amber); color: #0a0603; }
/* Free icons (desktop): each folder sits where it was dropped. */
.icons.free { inset: 0; width: auto; display: block; overflow: visible; pointer-events: none; }
.icons.free .ico { position: absolute; width: 92px; height: 58px; pointer-events: auto; touch-action: none; }
.icons.free .ico.drag { z-index: 5; cursor: grabbing; opacity: .85; background: rgba(241,185,47,.14); border-color: var(--line-strong); transition: none; }
.icons.free .ico.drop { transition: left .12s ease-out, top .12s ease-out; }
.ico.exe svg { color: var(--you); filter: drop-shadow(0 0 6px rgba(127,209,199,.3)); }

/* ---------- windows ---------- */
.win { position: absolute; z-index: 10; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 320px; min-height: 220px; background: var(--win); border: 1px solid var(--line-strong); border-radius: 5px; box-shadow: 0 24px 60px rgba(0,0,0,.65), 0 0 0 1px #000; animation: pop .16s ease-out both; }
.win.top { border-color: var(--amber-soft); box-shadow: 0 24px 70px rgba(0,0,0,.7), 0 0 0 1px #000, 0 0 30px rgba(241,185,47,.08); }
.win.max { left: 8px !important; top: 8px !important; width: calc(100% - 16px) !important; height: calc(100% - 16px) !important; }
.win[hidden] { display: none; }
.rz { position: absolute; z-index: 3; touch-action: none; }
.rz-n, .rz-s { left: 8px; right: 8px; height: 8px; cursor: ns-resize; } .rz-n { top: -4px; } .rz-s { bottom: -4px; }
.rz-e, .rz-w { top: 8px; bottom: 8px; width: 8px; cursor: ew-resize; } .rz-e { right: -4px; } .rz-w { left: -4px; }
.rz-ne, .rz-nw, .rz-se, .rz-sw { width: 14px; height: 14px; } .rz-ne { top: -5px; right: -5px; cursor: nesw-resize; } .rz-sw { bottom: -5px; left: -5px; cursor: nesw-resize; } .rz-nw { top: -5px; left: -5px; cursor: nwse-resize; } .rz-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
.rz-se::after { content: ''; position: absolute; right: 7px; bottom: 7px; width: 9px; height: 9px; background: linear-gradient(135deg, transparent 0 45%, var(--line-strong) 45% 52%, transparent 52% 66%, var(--line-strong) 66% 73%, transparent 73%); }
.win.max .rz { display: none; }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(6px); } }
.bar { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 6px 0 12px; border-bottom: 1px solid var(--line); background: var(--win-2); border-radius: 5px 5px 0 0; cursor: grab; user-select: none; touch-action: none; }
.win.top .bar { background: linear-gradient(var(--win-2), var(--win-2)) padding-box, rgba(241,185,47,.06); }
.bar:active { cursor: grabbing; }
.bar svg { width: 16px; height: 16px; color: var(--amber); flex: none; }
.ttl { flex: 1; min-width: 0; font: 600 13px/1 var(--mono); color: var(--bright); letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttl small { color: var(--dim); font-weight: 500; margin-left: 8px; }
.wb { flex: none; width: 28px; height: 26px; padding: 0; display: grid; place-items: center; border: 1px solid transparent; border-radius: 3px; background: none; color: var(--muted); cursor: pointer; }
.wb svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; }
.wb:hover { border-color: var(--line-strong); color: var(--bright); }
.wb.x:hover { border-color: var(--hot); color: var(--hot); }
.body { min-height: 0; overflow: auto; scrollbar-width: thin; scrollbar-color: var(--amber-deep) transparent; }
.status { display: flex; justify-content: space-between; gap: 12px; padding: 6px 12px; border-top: 1px solid var(--line); font: 500 11px/1.3 var(--mono); color: var(--dim); background: var(--win-2); border-radius: 0 0 5px 5px; }

/* explorer: a file list beside its content */
.ex { display: grid; grid-template-columns: 200px minmax(0, 1fr); height: 100%; min-height: 0; }
.files { border-right: 1px solid var(--line); padding: 10px 6px; overflow: auto; display: flex; flex-direction: column; gap: 2px; background: rgba(6,4,2,.4); }
.file { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 32px; padding: 0 10px; border: 1px solid transparent; border-radius: 3px; background: none; color: var(--muted); cursor: pointer; text-align: left; font: 500 13px/1.2 var(--mono); }
.file svg { width: 15px; height: 15px; flex: none; color: var(--amber-soft); }
.file:hover { color: var(--bright); background: var(--wash); }
.file[aria-current="true"] { color: #0a0603; background: var(--amber); }
.file[aria-current="true"] svg { color: #0a0603; }
.pane { overflow: auto; min-height: 0; }
.doc { padding: 26px 30px 34px; display: flex; flex-direction: column; gap: 20px; max-width: 900px; }
@container win (max-width: 620px) { .ex { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); } .files { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); } .file { width: auto; flex: none; } .doc { padding: 20px 18px 28px; } }
.body { container: win / inline-size; }

/* document parts */
.kick { font: 600 11px/1.3 var(--mono); letter-spacing: 2px; text-transform: uppercase; color: var(--amber); }
.kick::before { content: '> '; color: var(--dim); }
.doc h2 { font: 700 30px/1.08 var(--sans); color: var(--bright); letter-spacing: -.015em; text-wrap: balance; }
.doc h3 { font: 600 12px/1.3 var(--mono); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.doc p { max-width: 64ch; }
.lead { font-size: 17px; color: var(--bright); }
.mute { color: var(--muted); }
.dim { color: var(--dim); }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row > :first-child { font: 600 12px/1.8 var(--mono); letter-spacing: .5px; text-transform: uppercase; }
@container win (max-width: 520px) { .row { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.clip { position: relative; margin: 0; border: 1px solid var(--line-strong); border-radius: 3px; overflow: hidden; background: #000; }
.clip video, .clip img { display: block; width: 100%; height: auto; }
.clip figcaption { position: absolute; left: 10px; top: 10px; padding: 3px 7px; background: rgba(6,4,2,.82); border: 1px solid var(--line); border-radius: 2px; font: 500 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 6px; min-height: 22px; padding: 0 8px; border: 1px solid currentColor; border-radius: 2px; font: 600 11px/1 var(--mono); letter-spacing: 1px; text-transform: uppercase; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; background: rgba(6,4,2,.35); display: flex; flex-direction: column; gap: 8px; }
.card b { color: var(--bright); }
pre.art { margin: 0; font: 600 13px/1.15 var(--mono); color: var(--amber); text-shadow: 0 0 12px rgba(241,185,47,.35); }

/* abilities */
.abil { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.key { grid-row: span 2; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line-strong); border-bottom: 2px solid var(--amber-deep); border-radius: 3px; background: var(--win-2); color: var(--amber); }
.key svg { width: 22px; height: 22px; }
.abil .nm { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; color: var(--bright); font-weight: 600; }
.abil .nm small { font: 500 11px/1 var(--mono); color: var(--dim); letter-spacing: .5px; }
.abil .nm .sh { font: 500 12px/1.3 var(--mono); color: var(--amber); }
.abil p { font-size: 14px; color: var(--text); }

/* item tooltips, WoW grammar */
.tips { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.tt { width: 300px; max-width: 100%; border: 1px solid var(--line-strong); border-top: 2px solid var(--amber); border-radius: 3px; background: #0b0703; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
.tt .t-name { font: 600 15px/1.25 var(--mono); }
.tt .t-kind { display: flex; justify-content: space-between; font: 500 12px/1.4 var(--mono); color: var(--muted); }
.tt .t-stat { display: flex; align-items: center; gap: 8px; color: var(--bright); }
.tt .t-stat svg { width: 14px; height: 14px; color: var(--amber); }
.tt .t-rule { color: var(--ready); }
.tt .t-set { color: var(--r-set); }
.tt .t-flav { color: var(--muted); font-style: italic; }
.tt .t-ans { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
.ladder { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.rung { padding: 10px; border: 1px solid currentColor; border-radius: 3px; font: 600 12px/1.3 var(--mono); display: flex; flex-direction: column; gap: 4px; }
.rung span { color: var(--muted); font-weight: 500; font-size: 11px; }
@container win (max-width: 620px) { .ladder { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* floors */
.floors { display: flex; flex-direction: column; gap: 4px; }
.floor { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 12px; min-height: 38px; padding: 0 12px; border: 1px solid var(--line); border-left: 3px solid var(--fc, var(--amber)); border-radius: 3px; font: 500 14px/1 var(--mono); }
.floor b { color: var(--bright); font-weight: 600; }
.floor .lv { color: var(--muted); }
.floor.dark { color: var(--dim); border-left-color: var(--line); }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.room { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 3px; font-size: 14px; }
.room i { flex: none; width: 22px; height: 18px; border: 2px solid var(--rc); border-radius: 3px; background: color-mix(in srgb, var(--rc) 14%, transparent); }

/* bestiary */
.body > .zoo { height: 100%; }
.zoo { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0; height: 100%; min-height: 0; }
.zoo-art { position: relative; border-right: 1px solid var(--line); min-height: 280px; }
.zoo-art canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.zoo-art .cap { position: absolute; left: 16px; top: 14px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.zoo-art .cap b { font: 700 22px/1 var(--sans); color: var(--bright); letter-spacing: 1px; }
.zoo-art .cap span { font: 500 12px/1.4 var(--mono); color: var(--muted); }
.zoo-art .hint { position: absolute; left: 16px; bottom: 12px; font: 500 11px/1 var(--mono); color: var(--dim); pointer-events: none; }
.zoo-list { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.zoo-list button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 10px; border: 1px solid transparent; border-radius: 3px; background: none; text-align: left; cursor: pointer; }
.zoo-list button:hover { background: var(--wash); }
.zoo-list button[aria-current="true"] { border-color: var(--line-strong); background: rgba(241,185,47,.1); }
.zoo-list b { font: 600 13px/1.2 var(--mono); color: var(--bright); }
.zoo-list span { font: 500 11px/1.2 var(--mono); color: var(--dim); text-align: right; }
.zoo-list small { grid-column: 1 / -1; color: var(--muted); font-size: 13px; line-height: 1.35; }
@container win (max-width: 620px) { .zoo { grid-template-columns: minmax(0, 1fr); grid-template-rows: 300px auto; } .zoo-art { border-right: 0; border-bottom: 1px solid var(--line); } }

/* media */
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.thumb { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text); }
.thumb img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border: 1px solid var(--line); border-radius: 3px; }
.thumb:hover img { border-color: var(--amber); }
.thumb span { font: 500 12px/1.3 var(--mono); color: var(--muted); }
.thumb span b { color: var(--bright); font-weight: 600; }

.go { display: inline-flex; align-items: center; gap: 10px; align-self: flex-start; min-height: 48px; padding: 0 22px; border-radius: 3px; background: var(--amber); color: #0a0603; text-decoration: none; font: 600 13px/1 var(--mono); letter-spacing: 1.5px; }
.go:hover { background: var(--bright); }
.term { font: 500 14px/1.65 var(--mono); background: var(--inset); border: 1px solid var(--line); border-radius: 3px; padding: 14px 16px; }
.ps { color: var(--you); } .vio { color: var(--daemon); } .br { color: var(--bright); }
.cur { display: inline-block; width: .55em; height: 1.05em; background: var(--amber); vertical-align: -.15em; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }


/* skills, talents, floors, sets */
.sk { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.sk .key { width: 34px; height: 34px; grid-row: span 2; } .sk .key svg { width: 18px; height: 18px; }
.sk b { color: var(--bright); font-weight: 600; } .sk b small { font: 500 11px/1 var(--mono); color: var(--dim); margin-left: 8px; letter-spacing: .5px; }
.sk span { font-size: 14px; color: var(--text); }
.tiers { display: flex; flex-direction: column; gap: 8px; }
.tier { display: grid; grid-template-columns: 54px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: stretch; }
.tier > span { font: 600 11px/1.3 var(--mono); color: var(--muted); letter-spacing: 1px; padding-top: 10px; }
.tal { border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; background: rgba(6,4,2,.35); font-size: 13px; line-height: 1.4; }
.tal b { display: block; color: var(--bright); font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
@container win (max-width: 620px) { .tier { grid-template-columns: minmax(0, 1fr); } .tier > span { padding-top: 4px; } }
.stack { display: flex; flex-direction: column; align-items: stretch; gap: 0; max-width: 620px; }

//   RECIPES  real recorded CC0 samples (dist/sfx, see CREDITS.md), layered and pitched a little
//            differently every time, played through a small room so they sit in one space.
//            The palette is old hardware: thumps and metal for hits, relays for the clock,
//            mechanical keys for the prompt, a modem for daemons, a CRT humming underneath.
//   VOICES   small synthesized voices. They fill in whatever the samples lack (sub weight,
//            digital blips, chimes) and stand in for everything until the samples have loaded.

const NOTE = (n) => 440 * Math.pow(2, (n - 69) / 12); // MIDI note → Hz

// ---------- the samples ----------
// How many takes of each sound ship in dist/sfx (<name>-<n>.wav).
const BANK = {
  'punch-m': 5, 'punch-h': 5, 'soft-h': 4, 'soft-m': 3, 'metal-h': 4, 'metal-l': 3, 'plate-l': 4, 'plate-h': 3,
  'glass-l': 4, 'glass-h': 3, mining: 3, tin: 3, bell: 1, whoosh: 3, subdrop: 1, shimmer: 1, glitch: 4, scratch: 3,
  error: 2, tick: 3, confirm: 2, drop: 2, pluck: 2, glassui: 3, bong: 1, relay: 6, click: 4, key: 12, 'key-enter': 1, 'key-back': 1,
};
const banks = new WeakMap(); // AudioContext → { ready, buffers: Map(name → AudioBuffer[]) }
function loadBank(ctx, base = new URL('./sfx/', import.meta.url)) {
  if (banks.has(ctx)) return banks.get(ctx).loading;
  const bank = { ready: false, buffers: new Map() };
  bank.loading = Promise.all(Object.entries(BANK).flatMap(([name, n]) => Array.from({ length: n }, async (_, i) => {
    try {
      const res = await fetch(new URL(`${name}-${i}.wav`, base));
      if (!res.ok) return;
      const buf = await ctx.decodeAudioData(await res.arrayBuffer());
      const list = bank.buffers.get(name) || [];
      list[i] = buf;
      bank.buffers.set(name, list);
    } catch { /* that take stays missing */ }
  }))).then(() => { bank.ready = bank.buffers.size > 0; return bank; });
  banks.set(ctx, bank);
  return bank.loading;
}
const last = {}; // the take each sound used last, so repeats never play the same one twice in a row
function take(list, name) {
  const ok = list.map((b, i) => (b ? i : -1)).filter((i) => i >= 0);
  if (!ok.length) return null;
  let i = ok[Math.floor(Math.random() * ok.length)];
  if (ok.length > 1 && i === last[name]) i = ok[(ok.indexOf(i) + 1) % ok.length];
  last[name] = i;
  return list[i];
}
// One sample into `out`: gain, pitch (rate, with a little jitter so no two plays are identical),
// optional filters, and an offset `at` seconds after t.
function sample(ctx, out, t, name, { gain = 1, rate = 1, jitter = 0.04, lp, hp, at = 0 } = {}) {
  const list = banks.get(ctx)?.buffers.get(name);
  const buf = list && take(list, name);
  if (!buf) return;
  const src = ctx.createBufferSource(), g = ctx.createGain();
  src.buffer = buf;
  src.playbackRate.value = rate * (1 + (Math.random() * 2 - 1) * jitter);
  g.gain.value = gain;
  let node = src;
  for (const [type, f] of [['lowpass', lp], ['highpass', hp]]) {
    if (!f) continue;
    const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = 0.5;
    node.connect(b); node = b;
  }
  node.connect(g).connect(out);
  src.start(t + at);
}

// A modem talking: frequency-shift chatter between two tones, band-limited like a phone line.
function modem(ctx, out, t, { dur = 0.1, lo = 1070, hi = 1270, baud = 90, peak = 0.12 } = {}) {
  const o = ctx.createOscillator(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
  o.type = 'square'; bp.type = 'bandpass'; bp.frequency.value = (lo + hi) / 2; bp.Q.value = 1.2;
  const steps = Math.max(2, Math.round(dur * baud));
  for (let i = 0; i < steps; i++) o.frequency.setValueAtTime(Math.random() < 0.5 ? lo : hi, t + (i * dur) / steps);
  env(g, t, { a: 0.004, peak, d: dur, sustain: peak * 0.6 });
  o.connect(bp).connect(g).connect(out);
  o.start(t); o.stop(t + dur + 0.06);
}

// ---------- the recipes: what each event sounds like with the samples in ----------
// room: how much of the voice goes to the reverb. Each play(ctx, out, t, opts, S) layers samples
// (S(name, at, opts)) and synth building blocks into `out`.
const clamp01 = (x) => Math.min(1, Math.max(0, x));

const lifted = (ctx, out, k) => { const g = ctx.createGain(); g.gain.value = k; g.connect(out); return g; };
const RECIPES = {
  // Skill effects: synthesized, no samples (see markLock and the rest above).
  mark: { room: 0.1, play(ctx, out, t) { markLock(ctx, out, t); } },

// Keys on the prompt: a mechanical board, and a heavier Enter.
const KEYS = {
  char: (S) => S('key', 0, { gain: 0.3, jitter: 0.06 }),
  enter: (S) => { S('key-enter', 0, { gain: 0.42 }); S('key', 0, { gain: 0.12, rate: 0.75 }); },
  back: (S) => S('key-back', 0, { gain: 0.3 }),
  click: (S) => S('click', 0, { gain: 0.2, rate: 0.85 }), // a button pressed

// ---------- the room ----------
// A small, hard room: a few early reflections and a short dark tail, so layers share one space.
function roomIR(ctx, seconds = 0.5) {
  const sr = ctx.sampleRate, n = Math.floor(sr * seconds), b = ctx.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) {
    const d = b.getChannelData(c);
    let lp = 0;
    for (let i = 0; i < n; i++) {
      lp += 0.35 * ((Math.random() * 2 - 1) - lp); // darker than white noise
      d[i] = lp * Math.pow(1 - i / n, 2.6) * Math.exp(-i / (sr * 0.12));
    }
    for (const [ms, g] of [[7, 0.5], [13, 0.35], [19 + c * 3, 0.28], [29, 0.2]]) d[Math.floor((sr * ms) / 1000)] += g * (c ? -1 : 1);
  }
  return b;
}

// An electrical zap: noise through a falling band-pass, chopped by a 120 Hz buzz.
function zap(ctx, out, t, { dur = 0.1, peak = 0.3, f0 = 3800, f1 = 800 } = {}) {
  const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain(), chop = ctx.createGain(), lfo = ctx.createOscillator(), depth = ctx.createGain();
  src.buffer = noiseBuf(ctx);
  bp.type = 'bandpass'; bp.Q.value = 2.5;
  bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(Math.max(80, f1), t + dur);
  lfo.type = 'square'; lfo.frequency.value = 120; depth.gain.value = 0.5; chop.gain.value = 0.5;
  lfo.connect(depth).connect(chop.gain);
  env(g, t, { a: 0.002, peak, d: dur });
  src.connect(bp).connect(chop).connect(g).connect(out);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  lfo.start(t); lfo.stop(t + dur + 0.05);
}
// A stutter of short square blips falling in pitch, like data spilling out.
function chirps(ctx, out, t, { n = 4, from = 2600, to = 500, peak = 0.06, step = 0.019 } = {}) {
  for (let i = 0; i < n; i++) {
    const f = from * Math.pow(to / from, n > 1 ? i / (n - 1) : 0) * (0.94 + Math.random() * 0.12);
    osc(ctx, out, t + i * step, { type: 'square', f0: f, f1: f * 0.92, glide: 0.012, a: 0.001, peak: peak * (1 - i / (n * 1.6)), d: 0.014 });
  }
}

// ---- the digital hit (voiced in RECIPES.hit / RECIPES.crit): nothing recorded, all synthesized and quantized ----
const curves = new Map(), sahCache = new WeakMap();
// A bit-crusher: a staircase transfer curve, so whatever goes through it is coarse and grainy.
function crushBus(ctx, out, levels = 16, pre = 2.5, post = 0.5) {
  const g = ctx.createGain(), ws = ctx.createWaveShaper(), o = ctx.createGain();
  if (!curves.has(levels)) { const n = 2048, c = new Float32Array(n); for (let i = 0; i < n; i++) c[i] = Math.round(Math.max(-1, Math.min(1, (i / (n - 1)) * 2 - 1)) * levels) / levels; curves.set(levels, c); }
  ws.curve = curves.get(levels); g.gain.value = pre; o.gain.value = post; g.connect(ws).connect(o).connect(out);
  return g;
}
// Sample-and-hold static: a new random value every `hold` samples, so it buzzes like digital noise.
function sahBuf(ctx, hold) {
  let m = sahCache.get(ctx); if (!m) sahCache.set(ctx, (m = new Map()));
  if (!m.has(hold)) { const b = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate), d = b.getChannelData(0); let v = 0; for (let i = 0; i < d.length; i++) { if (i % hold === 0) v = Math.random() * 2 - 1; d[i] = v; } m.set(hold, b); }
  return m.get(hold);
}
function stat(ctx, out, t, { hold = 6, dur = 0.08, peak = 0.3, hp = 600 } = {}) {
  const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
  src.buffer = sahBuf(ctx, hold); f.type = 'highpass'; f.frequency.value = hp; env(g, t, { a: 0.001, peak, d: dur });
  src.connect(f).connect(g).connect(out); src.start(t); src.stop(t + dur + 0.05);
}
// Two-operator FM: a crunchy digital growl that sweeps down.
function fm(ctx, out, t, { fc = 220, f1 = fc, ratio = 2, i0 = 8, i1 = 0.5, dur = 0.14, peak = 0.3 } = {}) {
  const c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
  c.frequency.setValueAtTime(fc, t); if (f1 !== fc) c.frequency.exponentialRampToValueAtTime(f1, t + dur);
  m.frequency.setValueAtTime(fc * ratio, t); if (f1 !== fc) m.frequency.exponentialRampToValueAtTime(f1 * ratio, t + dur);
  mg.gain.setValueAtTime(fc * i0, t); mg.gain.exponentialRampToValueAtTime(Math.max(1, fc * i1), t + dur);
  m.connect(mg).connect(c.frequency); env(g, t, { a: 0.001, peak, d: dur });
  c.connect(g).connect(out); c.start(t); m.start(t); c.stop(t + dur + 0.05); m.stop(t + dur + 0.05);
}
// A dark, repeating echo: everything sent in gets a crushed tail.
function echoBus(ctx, out, { time = 0.085, fb = 0.5, wet = 0.5, lp = 2600 } = {}) {
  const input = ctx.createGain(), d = ctx.createDelay(1), f = ctx.createGain(), l = ctx.createBiquadFilter(), w = ctx.createGain();
  d.delayTime.value = time; f.gain.value = fb; l.type = 'lowpass'; l.frequency.value = lp; w.gain.value = wet;
  input.connect(out); input.connect(d); d.connect(l).connect(f).connect(d); l.connect(w).connect(out);
  return input;
}
// Ring modulation: a carrier multiplied by a low tone, the metallic buzz of old electronics.
function ringmod(ctx, out, t, { fc = 900, fmod = 120, dur = 0.2, peak = 0.2, type = 'square' } = {}) {
  const c = ctx.createOscillator(), m = ctx.createOscillator(), g = ctx.createGain(), e = ctx.createGain();
  c.type = type; c.frequency.value = fc; m.type = 'sine'; m.frequency.value = fmod; g.gain.value = 0;
  m.connect(g.gain); env(e, t, { a: 0.001, peak, d: dur });
  c.connect(g).connect(e).connect(out); c.start(t); m.start(t); c.stop(t + dur + 0.05); m.stop(t + dur + 0.05);
}
// The body: a run of blips falling in pitch over static, like a signal draining. Returns its length.
function cascade(ctx, b, t, n, top = 4800) {
  for (let i = 0; i < n; i++) osc(ctx, b, t + i * 0.0105, { type: i % 2 ? 'square' : 'sawtooth', f0: top * Math.pow(0.12, i / n) * (0.9 + Math.random() * 0.2), a: 0.001, peak: 0.1, d: 0.009 });
  stat(ctx, b, t, { hold: 5, dur: n * 0.0105 + 0.05, peak: 0.16, hp: 1500 });
  return n * 0.0105;
}
// The impact: a hard click, a short electrical zap and a crushed thump, all at once.
function impact(ctx, b, t, k, c) {
  noise(ctx, b, t, { type: 'highpass', f0: 4500, a: 0.0005, peak: 0.45, d: 0.012 });
  zap(ctx, b, t, { dur: 0.05 + 0.04 * k, peak: 0.4, f0: 6000, f1: 900 });
  osc(ctx, b, t, { type: 'square', f0: 110, f1: 36, glide: 0.06, a: 0.001, peak: 0.28 + 0.18 * k, d: 0.1 + 0.05 * k });
  if (c) { zap(ctx, b, t + 0.045, { dur: 0.07, peak: 0.3, f0: 7000, f1: 1500 }); osc(ctx, b, t, { type: 'sawtooth', f0: 220, f1: 60, glide: 0.08, a: 0.001, peak: 0.2, d: 0.14 }); }
}
// Impact, then the falling cascade into an FM growl, then digital pings (a console rejecting the packet)
// over a ringing tail through crushed echoes. k is how big the hit is (0–1); c is a crit.
function digitalHit(ctx, out, t, k, c) {
  const fx = echoBus(ctx, out, { time: 0.09, fb: 0.55, wet: 0.5 }), b = crushBus(ctx, fx, 12, 2.8);
  impact(ctx, b, t, k, c);
  const w = cascade(ctx, b, t + 0.015, c ? 28 : 12 + Math.round(10 * k));
  const t0 = t + 0.015 + w;
  fm(ctx, b, t0, { fc: 110, f1: 40, ratio: 1.5, i0: 8, i1: 0.5, dur: 0.2 + 0.1 * k, peak: 0.38 });
  [2093, 1568, 1047, 784].forEach((f, i) => {
    osc(ctx, crushBus(ctx, fx, 8), t0 + 0.09 + i * 0.06, { type: 'square', f0: f, a: 0.001, peak: 0.1, d: 0.05 });
    ringmod(ctx, fx, t0 + 0.09 + i * 0.06, { fc: f * 1.5, fmod: 150, dur: 0.06, peak: 0.05 });
  });
  for (const [f, g] of [[1900, 0.04], [2850, 0.03]]) osc(ctx, fx, t0 + 0.05, { type: 'sine', f0: f, f1: f * 0.97, glide: 0.5, a: 0.002, peak: g, d: 0.5 + 0.2 * k });
}

// ---- candidates for chit / break / patch / interrupt, in the digital hit's language (A and B each) ----
// Glass-like data shards: fast random high blips, each a little lower and quieter.
function shards(ctx, out, t, { n = 7, hi = 7000, lo = 2200, peak = 0.09, span = 0.12 } = {}) {
  for (let i = 0; i < n; i++) { const f = lo + Math.random() * (hi - lo); osc(ctx, out, t + Math.random() * span * (i / n + 0.15), { type: 'square', f0: f, f1: f * 0.85, glide: 0.02, a: 0.0005, peak: peak * (1 - i / (n * 1.4)), d: 0.012 + Math.random() * 0.02 }); }
}
// ---- chit, break, patch and interrupt (picked by Dave from synthesized candidates, 2026-10-02) ----
// Chit A: a crushed snap and a spray of glassy data shards, with a ringing ping.
function chitShatter(ctx, out, t) {

// The power-up: the monitor comes on (a line of light opens into the screen), the mark rises behind its
// square, the name settles, and the screen waits for a key. The first key (or tap) while it's still

function powerOn({ sound = () => {}, reducedMotion = () => false } = {}) {
  const still = reducedMotion();

  const el = document.createElement('div');
  el.className = `poweron${still ? ' still' : ''}`;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-label', 'BLACKBOX');
  el.innerHTML = `<div class="po-flash" aria-hidden="true"></div>
    <div class="po-stage">
      <span class="bb-logo po-logo" aria-hidden="true"></span>
      <h1 class="po-word">BLACKBOX</h1>
      <p class="po-sub">Model 7 · BLACKBOX/OS 0.9.4</p>
      
    </div>`;
  (document.getElementById('screen') || document.body).appendChild(el);
  return new Promise((resolve) => {

    setTimeout(() => { ready = true; go(new Event('auto')); }, still ? 300 : 3000);
    if (still) el.classList.add('ready');

        const th = (i / zs.length) * Math.PI * 2, x = Math.cos(th) * 66, zz = Math.sin(th) * 44, bob = anim({ k: 'bob', amp: 1.5, speed: 1.6 + (i % 3) * 0.4 });

    radius = Math.max(40, ...points.map((p) => Math.hypot(p.x, p.y, p.z)));

  // ---------- parts ----------
  // The body isn't a part: it shows the virus's armor, bright while chits remain, dim once stripped.
  function body(v) {
    const max = v.parts.reduce((n, p) => n + (p.maxArmor || 0), 0);
    const left = v.parts.reduce((n, p) => n + (p.integrity > 0 ? p.armor || 0 : 0), 0);

      return living[Number(region.slice(4)) - 1] || { integrity: 0, max: 1, ghost: true };
    }
    if (!region.includes('@')) return v.parts.find((p) => p.id === region);
    const [base, side] = region.split('@');
    return v.parts.find((p) => p.id === base) || v.parts.find((p) => p.id === base + (side === 'L' ? 'a' : 'b'));
  }

  // ---------- animation ----------
  const rotY = (x, z, a) => [x * Math.cos(a) + z * Math.sin(a), -x * Math.sin(a) + z * Math.cos(a)];
  const rotZ = (x, y, a) => [x * Math.cos(a) - y * Math.sin(a), x * Math.sin(a) + y * Math.cos(a)];
  function animate(p, t) {
    const A = anims[p.a];
    let { x, y, z, nx, ny, nz } = p;
    if (!A || A.k === 'none') return { x, y, z, nx, ny, nz };
    const [cx, cy, cz] = A.c || [0, 0, 0];
    switch (A.k) {
      case 'breathe': { const k = 1 + Math.sin(t * A.speed) * A.amp; x = cx + (x - cx) * k; y = cy + (y - cy) * k; z = cz + (z - cz) * k; break; }
      case 'ripple': { const k = 1 + Math.sin(t * A.speed - A.phase) * A.amp; x = cx + (x - cx) * k; z = cz + (z - cz) * k; break; }
      case 'wave': y += Math.sin(t * A.speed + x * A.freq) * A.amp; z += Math.cos(t * A.speed * 0.7 + x * A.freq) * A.amp * 0.5; break;
      case 'bob': y += Math.sin(t * A.speed) * A.amp; break;
      case 'sway': { const a = Math.sin(t * A.speed + A.phase) * A.amp; const d = Math.hypot(x - cx, y - cy, z - cz) / 40; [x, y] = rotZ(x - cx, y - cy, a * d); x += cx; y += cy; [nx, ny] = rotZ(nx, ny, a * d); break; }
      case 'sweep': { const a = Math.sin(t * A.speed) * A.amp; [x, z] = rotY(x - cx, z - cz, a); x += cx; z += cz; [nx, nz] = rotY(nx, nz, a); break; }

  // ---------- drawing ----------
  const LIGHT = (() => { const l = [-0.45, -0.6, -0.66], n = Math.hypot(...l); return l.map((v) => v / n); })();
  function draw(now) {
    requestAnimationFrame(draw);
    if (!canvas?.isConnected || now - previous < 40) return;
    const delta = Math.min(100, now - previous);
    previous = now;
    const s = getState();
    const v = s?.encounter?.virus;
    if (!v) return;
    const key = v.id + v.parts.length;
    if (key !== builtFor) { builtFor = key; build(v); shards.length = 0; }
    const motion = canMove();
    const moving = motion && s.encounter.phase === 'active' && !s.encounter.paused;
    if (moving) angle += delta * 0.00016;
    if (motion) clock += delta / 1000;

    const { width, height } = canvas.getBoundingClientRect();
    if (!width || !height) return;

      for (const d of rain) {

        if (d.y > height) { d.y = -10; d.x = Math.random() * width; }
        if (Math.random() < 0.05) d.c = Math.random() < 0.5 ? '0' : '1';

    const quake = motion && shake && now - shake.time < 350 ? (1 - (now - shake.time) / 350) ** 2 * shake.power : 0;
    const qx = quake ? (Math.random() - 0.5) * quake : 0, qy = quake ? (Math.random() - 0.5) * quake : 0;

    const phased = s.encounter.cycle % 2 === 1;

    if (motion) for (const [id, h] of hits) {

      const u = h.kind === 'attack' ? (now - h.time) / STRIKES[how] : 1;

    }
    if (strikes.size) for (const p of points) {

    for (let i = 0; i < points.length; i++) {

      const part = resolvePart(v, p.region);
      if (!part) continue;
      const h = part.id ? hits.get(part.id) : null;
      if (part.integrity === 0) { if (!(h?.kind === 'break' && motion)) continue; }
      if (part.ghost) continue;
      if (p.region !== 'body' && part.phase && phased && i % 3) continue; // Flicker: the Shade is half gone on odd cycles

      const y1 = q.y * cp - z1 * sp; z1 = q.y * sp + z1 * cp;

      // The strike: the attacking part comes at you its own way (nearer, so bigger and spread from the middle), past its frame.
      const st = strikes.size && part.id && part.integrity > 0 ? strikes.get(part.id) : null;

    // An attacking part's cells draw last, on the layer over the page; the rest on the panel.
    const near = [];
    for (const c of cells.values()) {

      const depth = Math.max(0.35, Math.min(1, 0.95 - c.z / (radius * 2.2)));

      const lit = 0.18 + c.lum * 0.82;
      let ch = RAMP[Math.max(1, Math.min(RAMP.length - 1, Math.round(lit * (RAMP.length - 1))))];

      if (ratio < 0.35 && !broken && Math.random() < 0.12) ch = '%&$?!'[Math.floor(Math.random() * 5)];

      if (h?.kind === 'crit' && fresh > 0.4 && c.i % 3 === 0) ch = '#';
      if (c.glitch) ch = (c.i + Math.floor(now / 50)) % 2 ? '1' : '0';
      if (broken && done > releaseOf(c.i) * 0.5) ch = (c.i + Math.floor(now / 70)) % 2 ? '1' : '0';
      const flare = h ? (broken ? COLORS.bright : h.kind === 'attack' ? COLORS.hot : h.kind === 'crit' ? COLORS.gold : COLORS.bright) : null;
      const attacking = part.id && nowSources.has(part.id);
      ctx.fillStyle = flare || (attacking ? COLORS.hot : part.id === selected ? COLORS.gold : c.region === 'body' ? (ratio < 0.4 ? COLORS.dim : COLORS.deep) : ratio < 0.4 ? COLORS.dim : lit > 0.7 ? COLORS.bright : COLORS.amber);
      const age = h ? (now - h.time) / 900 : 0;

      c.ch = ch;
    }

    // What strikes throw: shock rings and grind sparks, from the part's middle on the panel, out over the page.
    if (striking) for (const [id, st] of strikes) {
      if (!['shock', 'grind', 'spill', 'volley', 'beam'].includes(st.how)) continue;
      const mine = [...cells.values()].filter((c) => c.part?.id === id);
      if (!mine.length) continue;
      const mx = mine.reduce((a, c) => a + c.x, 0) / mine.length, my = mine.reduce((a, c) => a + c.y, 0) / mine.length;
      const ext = Math.max(12, Math.sqrt(mine.reduce((a, c) => a + (c.x - mx) ** 2 + (c.y - my) ** 2, 0) / mine.length));
      const chars = mine.map((c) => c.ch).filter((ch) => ch && ch.trim());
      if (st.how === 'volley') { // a tight clump that swells fast: it comes straight at you
        st.h.shots ??= 0;
        while (st.h.shots < VOLLEYS.length && st.u >= VOLLEYS[st.h.shots]) {

nk.","max":3}],"subs":{"warden":{"name":"Warden","role":["Tank","Retaliation"],"idea":"Every hit comes to you, and goes back.","solo":"Outlasts anything and hits back.","edge":{"name":"Grudge","rule":"The part that last hit you takes +20% from your hits."},"skills":[{"id":"reject","name":"Reject","icon":"interrupt","cooldown":2,"syntax":"reject <part>","rule":"Deals 28 damage to the target. If the target was the last part to hit you, also shields you for 10.","level":10},{"id":"suspend","name":"Suspend","icon":"interrupt","cooldown":4,"syntax":"suspend [part]","rule":"Delays the target's next attack by 2 cycles. A charged attack loses its charge. With no target named, delays the attack due soonest.","level":12},{"id":"bulkhead","name":"Bulkhead","icon":"shell-shield","cooldown":6,"syntax":"bulkhead","rule":"For 2 cycles, attacks against you deal half damage, and charged attacks deal a quarter. In a crew, draws all attacks to you for the duration.","level":14},{"id":"blowback","name":"Blowback","icon":"spike","cooldown":3,"syntax":"blowback <part>","rule":"Deals damage equal to every attack that has hit you since your last Blowback, including damage absorbed or reduced, up to 70. Makes Retaliate usable next cycle. Breaks 2 \u25c6 on an armored target.","level":16},{"id":"harden","name":"Harden","icon":"shell-shield","cooldown":6,"syntax":"harden","rule":"Grants you 1 \u25c6. The next attack against you deals no damage.","level":18},{"id":"quarantine","name":"Quarantine","icon":"event-lock","cooldown":6,"syntax":"quarantine [part]","rule":"Delays the target's next attack by 3 cycles, and the target takes 25% more damage until it attacks. Interrupts a cast it is compiling.","level":20},{"id":"throttle","name":"Throttle","icon":"interrupt","cooldown":4,"syntax":"throttle [part]","rule":"Deals 20 damage and halves the target's attack damage for 3 cycles. Against a loud part (a Tripwire set off, Double Extortion, a Bricker's rage), lasts 6 cycles and silences it.","level"   function layout() {
    const free = !phone.matches; box.classList.toggle('free', free);
    if (!free) { for (const el of icons()) el.style.left = el.style.top = ''; return; }
    const rows = Math.max(1, Math.floor((desk.clientHeight - 20) / STEP));
    icons().forEach((el, i) => { const s = saved[el.dataset.app]; place(el, s ? s[0] : 12 + Math.floor(i / rows) * COLW, s ? s[1] : 10 + (i % rows) * STEP); });
  }
  box.addEventListener('pointerdown', (e) => {
    const el = e.target.closest('.ico'); if (!el || phone.matches || e.button > 0) return;
    for (const b of icons()) b.classList.toggle('on', b === el);
    const sx = e.clientX, sy = e.clientY, ox = el.offsetLeft, oy = el.offsetTop; let moving = false;
    const move = (m) => {
      const dx = m.clientX - sx, dy = m.clientY - sy;
      if (!moving && Math.hypot(dx, dy) < 5) return;
      if (!moving) { moving = true; el.setPointerCapture(e.pointerId); el.classList.remove('drop'); el.classList.add('drag'); }
      place(el, ox + dx, oy + dy);
    };
    const up = () => {
      removeEventListener('pointermove', move); removeEventListener('pointerup', up); removeEventListener('pointercancel', up);
      if (!moving) return;
      dragged = true; setTimeout(() => { dragged = false; }, 0);
      el.classList.remove('drag'); el.classList.add('drop');
      place(el, Math.round(el.offsetLeft / 8) * 8, Math.round(el.offsetTop / 8) * 8);
      saved[el.dataset.app] = [el.offsetLeft, el.offsetTop];
      try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch {}
      snd.key('click');
    };
    addEventListener('pointermove', move); addEventListener('pointerup', up); addEventListener('pointercancel', up);
  });
  // Double-click the bare desktop to tidy the folders back into their column.
  desk.addEventListener('dblclick', (e) => { if (e.target !== desk) return; saved = {}; try { localStorage.removeItem(KEY); } catch {} for (const el of icons()) el.classList.add('drop'); layout(); });
  layout(); addEventListener('resize', layout); phone.addEventListener?.('change', layout);
})();
task.innerHTML = `<span class="sp"></span><span class="rx" id="rx">rx 0.0k/s</span>`;

const pad = (n) => String(n).padStart(2, '0');
const tick = () => { const d = new Date(); $('clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}`; const rx = $('rx'); if (rx) rx.textContent = `rx ${(0.6 + Math.random() * 1.4).toFixed(1)}k/s`; };
tick(); setInterval(tick, 2000);

const boot = () => { if (!phone.matches) open('readme'); };
// The game's power-up (poweron.mjs) on the screen: the tube comes on, the mark rises, and it starts by itself (a click skips ahead).
powerOn({ sound: (n) => { snd.start(); snd.play(n); }, reducedMotion: () => reduced }).then(boot);
</script>

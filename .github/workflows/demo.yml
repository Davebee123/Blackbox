# The demo (docs/demo-plan.md Phase 1): every push to the demo branch, and every demo-* tag, builds with --demo and
# pushes it to the itch.io page with butler. A release is a tag (demo-0.1), a hotfix the next (demo-0.1.1), cherry-picked
# from main; the tag's number is the build's (DEMO_VERSION). Needs the ITCH_API_KEY secret and the ITCH_TARGET variable
# (<itch user>/<game>, e.g. someone/blackbox); without them the build runs and the push is skipped.
name: Deploy the demo to itch.io
on:
  push:
    branches: [demo]
    tags: ['demo-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo
  cancel-in-progress: false
jobs:
  itch:
    runs-on: ubuntu-latest
    env:
      ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
      ITCH_TARGET: ${{ vars.ITCH_TARGET || 'matzahboy/blackbox' }} # the itch page (matzahboy.itch.io/blackbox); a repository variable overrides it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:fast
      - name: Build the demo
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/demo-* ]]; then export DEMO_VERSION="${GITHUB_REF_NAME#demo-}"; fi
          node scripts/build.mjs build --demo
          echo "USERVERSION=${DEMO_VERSION:-$(node -e "import('./dist/demo.mjs').then((m) => console.log(m.DEMO_BUILD.version))")}+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: Push to itch.io
        shell: bash
        run: |
          if [ -z "$ITCH_API_KEY" ] || [ -z "$ITCH_TARGET" ]; then
            echo '### Demo built, not pushed' >> "$GITHUB_STEP_SUMMARY"
            echo 'Add the ITCH_API_KEY secret and the ITCH_TARGET variable (Settings → Secrets and variables → Actions).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # butler from itch's broth, on either of its two hosts (each has failed now and then)
          for host in broth.itch.ovh broth.itch.zone broth.itch.ovh; do curl -sSfL --retry 2 -o butler.zip "https://$host/butler/linux-amd64/LATEST/archive/default" && break; sleep 5; done
          unzip -q butler.zip -d butler && chmod +x butler/butler
          BUTLER_API_KEY="$ITCH_API_KEY" ./butler/butler push build "$ITCH_TARGET:html5" --userversion "$USERVERSION"
          echo "### Pushed $USERVERSION to $ITCH_TARGET:html5" >> "$GITHUB_STEP_SUMMARY"
